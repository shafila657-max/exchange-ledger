<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exchange Ledger Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--side:#f6f6f7;--surface:#fff;--surface-2:#f6f6f8;--border:#ebebef;--text:#18181b;--muted:#71717a;
  --accent:#6b3fe0;--accent-ink:#fff;--accent-soft:#efeafd;--accent-2:#d9cffa;
  --pos:#15955a;--pos-soft:#e7f7ee;--danger:#dc2626;--danger-soft:#fdecec;--warn:#a15c07;--warn-soft:#fdf3e1;--info:#6b3fe0;--info-soft:#efeafd;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111114;--side:#18181c;--surface:#18181c;--surface-2:#202026;--border:#2a2a31;--text:#ececf1;--muted:#9a9aa6;
  --accent:#9b7bff;--accent-ink:#120a2b;--accent-soft:#251d41;--accent-2:#3d3466;
  --pos:#3fcf8e;--pos-soft:#11291e;--danger:#f87171;--danger-soft:#2c1515;--warn:#f0b35a;--warn-soft:#2a2112;--info:#9b7bff;--info-soft:#251d41;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111114;--side:#18181c;--surface:#18181c;--surface-2:#202026;--border:#2a2a31;--text:#ececf1;--muted:#9a9aa6;
  --accent:#9b7bff;--accent-ink:#120a2b;--accent-soft:#251d41;--accent-2:#3d3466;
  --pos:#3fcf8e;--pos-soft:#11291e;--danger:#f87171;--danger-soft:#2c1515;--warn:#f0b35a;--warn-soft:#2a2112;--info:#9b7bff;--info-soft:#251d41;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:256px;flex:none;background:var(--side);border-right:1px solid var(--border);padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandrow{display:flex;align-items:center;gap:12px;padding:0 4px 20px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#8b5cf6,#5b2fd6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 4px 10px rgba(107,63,224,.3)}
.brand{font-weight:650;font-size:15px;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 10px;margin-bottom:22px;color:var(--muted)}
.search input{border:none;background:none;padding:9px 0;outline:none}
.search kbd{font:11px/1 inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 5px;color:var(--muted)}
.navsec{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:0 10px;margin:18px 0 6px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text);font-weight:500;margin-bottom:2px}
.nav a svg{color:var(--muted)}
.nav a:hover{background:rgba(0,0,0,.035);text-decoration:none}
.nav a.on{background:var(--surface);box-shadow:var(--shadow)}
.nav a.on svg{color:var(--text)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--text)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.sidefoot{margin-top:24px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--muted)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .t{font-size:16px;font-weight:550}
.content{padding:24px 32px 64px;max-width:1400px;width:100%}
.alert{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:20px;color:var(--text);flex-wrap:wrap}
.alert svg{color:var(--accent)}
.alert b{font-weight:600}
.alert .sep{color:var(--muted)}
.alert span.muted{flex:1 1 280px}
.alert.info{background:var(--accent-soft)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.015em;font-weight:650}
h2{font-size:16px;margin:0 0 14px;font-weight:600;letter-spacing:-.01em}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cardh h2{margin:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* KPI strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.strip .cell{padding:20px 22px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -1px -1px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l l" "v sp" "s s";column-gap:12px;align-items:end}
.strip .l{grid-area:l;font-size:13px;color:var(--muted);font-weight:500}
.strip .v{grid-area:v;font-size:23px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .s{grid-area:s;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:8px;font-weight:500}
.strip .s svg{width:14px;height:14px}
.strip .s.up{color:var(--pos)}.strip .s.down{color:var(--danger)}
.strip .spark{grid-area:sp;width:84px;height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-2);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
/* chart */
.bigvals{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.bigvals .bv{padding-right:28px;border-right:1px solid var(--border)}
.bigvals .bv:last-of-type{border-right:none}
.bigvals .bv .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigvals .bv .k{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--border);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .b1{fill:var(--accent)}.chart .b2{fill:var(--accent-2)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--surface-2)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);padding:10px 12px;font-size:12px;min-width:150px;opacity:0;transition:opacity .1s;z-index:3}
.tip.show{opacity:1}
.tip .tt{font-weight:600;margin-bottom:6px;font-size:13px}
.tip .tr{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .tr span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:550}
/* tables */
.tw{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;background:var(--surface-2)}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
thead th{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:650;border-bottom:none}
tr.dim td{opacity:.5}
.tw table.wide{min-width:1040px}
td:first-child{white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:550;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--pos-soft);color:var(--pos)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-weight:550;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{font-weight:550;color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:550}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search input:focus{outline:none}
textarea{resize:vertical;min-height:64px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg .full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chain .c{background:var(--surface-2);border-radius:12px;padding:14px 16px;position:relative}
.chain .c .l{font-size:12px;color:var(--muted);font-weight:500}
.chain .c .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.chain .c .r{font-size:12px;color:var(--muted);margin-top:4px}
.steps{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.step{flex:1 1 130px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted);border-top:3px solid var(--border);font-weight:500}
.step.done{border-top-color:var(--accent);color:var(--text)}
.step.cur{border-top-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.preview{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px}
.preview .kv{grid-template-columns:1fr auto}
.kv.money dd{text-align:right;font-weight:550}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;width:max-content;max-width:100%}
.tabs a{padding:7px 12px;color:var(--muted);font-weight:550;border-radius:9px;white-space:nowrap}
.tabs a.on{color:var(--text);background:var(--surface);box-shadow:var(--shadow)}
.tabs a:hover{text-decoration:none;color:var(--text)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hist{padding:8px 0;border-bottom:1px solid var(--border)}
.hist:last-child{border-bottom:none}
dialog{border:1px solid var(--border);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 24px 60px rgba(16,24,40,.25)}
dialog::backdrop{background:rgba(17,17,20,.4);backdrop-filter:blur(2px)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border)}
.mh h2{margin:0}
.mb{padding:18px 22px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}
.x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.checklist{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.checklist label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.checklist label:last-child{border-bottom:none}
.checklist input{width:auto;accent-color:var(--accent)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
#toast.err{background:var(--danger);color:#fff}
.mbtn,.tabbar,.scrim{display:none}
@media (max-width:1240px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- tablet & phone: drawer navigation ---------- */
@media (max-width:960px){
  .side{position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(300px,86vw);height:100%;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(20px + env(safe-area-inset-top))}
  body.menu-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(10,10,14,.45);opacity:0;pointer-events:none;transition:opacity .2s}
  body.menu-open .scrim{opacity:1;pointer-events:auto}
  body.menu-open{overflow:hidden}
  .nav a.on::before{display:none}
  .mbtn{display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border-radius:10px;flex:none}
  .topbar{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .tl{display:flex;align-items:center;gap:10px;min-width:0}
  .topbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .content{padding:18px 16px 64px}
  .g2,.g3{grid-template-columns:1fr}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tw{margin:0 -16px;padding:0 16px}
  .card{padding:16px;border-radius:14px;margin-bottom:14px}
  .grid{gap:14px}
}
/* ---------- phone ---------- */
@media (max-width:760px){
  body{font-size:14px}
  input,select,textarea{font-size:16px;padding:10px 12px}            /* stops iOS zoom on focus */
  .btn{padding:9px 13px}
  .btn.sm{padding:7px 11px}
  /* top bar: title + compact actions */
  .topbar .t{font-size:15px}
  #pactions{gap:6px;flex-wrap:nowrap}
  #pactions .hide-m{display:none}
  #pactions .btn{padding:0 11px;height:38px}
  #pactions .ico-m{width:38px;padding:0;justify-content:center}
  /* bottom tab bar */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--side) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;margin:0;padding:5px 0;line-height:1.2;color:var(--muted);font:500 10.5px/1.2 inherit;background:none;border:none;cursor:pointer;text-decoration:none}
  .tabbar svg.i{width:21px;height:21px}
  .tabbar .on{color:var(--accent)}
  .tabbar .cnt{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
  .content{padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
  .tw{margin:0 -14px;padding:0 14px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  /* type scale */
  h1{font-size:19px;line-height:1.25}
  h2{font-size:15px;margin-bottom:12px}
  .head{margin-bottom:14px;align-items:flex-start}
  .head>.row{width:100%}
  .head>.row .btn{flex:1 1 auto;justify-content:center}
  .card{padding:14px;margin-bottom:12px}
  .cardh{flex-wrap:wrap}
  .alert{padding:12px 14px;font-size:13px;margin-bottom:14px}
  /* KPI strip: tidy 2-up tiles */
  .strip{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
  .strip .cell{padding:14px;grid-template-areas:"l" "v" "s";grid-template-columns:minmax(0,1fr);align-items:start;align-content:start}
  .strip .l{font-size:12px}
  .strip .v{font-size:19px;margin-top:6px}
  .strip .s{font-size:11.5px;margin-top:4px}
  .strip .spark{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:16px}
  .bigvals{gap:10px 20px;margin-bottom:12px}
  .bigvals .bv{border-right:none;padding-right:0}
  .bigvals .bv .v{font-size:21px}
  .chain{gap:10px}
  .chain .c{padding:12px}
  .chain .c .v{font-size:16px}
  .steps{gap:4px}
  .step{flex:1 1 calc(50% - 4px);padding:8px 10px;font-size:11.5px}
  .filters{gap:8px}
  .filters>*{flex:1 1 calc(50% - 8px)}
  .tabs{width:auto}
  .kv{gap:6px 14px}
  /* forms open as a bottom sheet */
  dialog{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:none}
  dialog[open]{display:flex;flex-direction:column}
  .mh{padding:14px 16px}
  .mb{padding:14px 16px;flex:1;min-height:0}
  .mf{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .mf .btn{flex:1;justify-content:center;padding:12px}
  .fg{grid-template-columns:1fr;gap:12px}
  .preview{grid-row:auto!important}
  /* tables become stacked cards */
  .tw{overflow:visible}
  .tw table,.tw tbody,.tw tfoot{display:block}
  .tw table.wide{min-width:0}
  .tw thead{display:none}
  .tw tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
  .tw tbody tr:hover{background:var(--surface)}
  .tw td{display:block;padding:0;border:none;text-align:left;white-space:normal;min-width:0;overflow-wrap:anywhere}
  .tw td.num{text-align:left}
  .tw td::before{content:attr(data-label);display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:2px;letter-spacing:.01em}
  .tw td[data-label=""]::before,.tw td:first-child::before{display:none}

  .tw table.ledger td:nth-child(4),.tw table.ledger td:nth-child(5){grid-column:1;font-weight:600}

  .tw table.deals tfoot tr{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tw table.deals tfoot td:first-child{grid-column:1/-1}
}

<script>
'use strict';
/* ============================ helpers ============================ */
const R2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const R6 = n => Math.round((n + Number.EPSILON) * 1e6) / 1e6;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0, 10);
const nfIN = new Intl.NumberFormat('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nfUS = new Intl.NumberFormat('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money = (n, c) => (n == null || isNaN(n)) ? '—' : (c === 'INR' ? '₹' + nfIN.format(n) : c + ' ' + nfUS.format(n));
const signed = (n, c) => `<span class="${n > 0.004 ? 'pos' : n < -0.004 ? 'neg' : ''}">${money(n, c)}</span>`;
const rate = n => { if (n == null || isNaN(n)) return '—'; const r = Math.round(n * 1e4) / 1e4, d = (String(r).split('.')[1] || '').length; return d < 2 ? r.toFixed(2) : String(r); };
const fdate = s => s ? new Date(s.length === 10 ? s + 'T00:00:00' : s).toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : '—';
const fdt = s => s ? new Date(s).toLocaleString('en-GB', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}) : '—';
const num = v => { const n = parseFloat(v); return isNaN(n) ? NaN : n; };

/* ============================ labels ============================ */
const PT = {saudi_agent: 'Saudi Agents', saudi_collector: 'Saudi Collectors', dubai_collector: 'Dubai Collectors', dubai_agent: 'Dubai Agents', distributor: 'Indian Distributors', operator: 'Operator Cash'};
const PT1 = {saudi_agent: 'Saudi Agent', saudi_collector: 'Saudi Collector', dubai_collector: 'Dubai Collector', dubai_agent: 'Dubai Agent', distributor: 'Indian Distributor', operator: 'Operator Cash Account'};
const DS = {pending_allocation: ['Pending Allocation', ''], assigned: ['Assigned to Distributor', 'b-blue'], out_for_delivery: ['Out for Delivery', 'b-amber'], completed: ['Completed', 'b-green'], cancelled: ['Cancelled', 'b-red']};
const DS_FLOW = ['pending_allocation', 'assigned', 'out_for_delivery', 'completed'];
const BS = {collected_saudi: ['Collected in Saudi', ''], in_transit: ['In Transit to Dubai', 'b-amber'], converted_aed: ['Converted to AED', 'b-blue'], settled: ['Settled with Dubai Agent', 'b-green']};
const BS_FLOW = ['collected_saudi', 'in_transit', 'converted_aed', 'settled'];
const dBadge = d => `<span class="badge ${DS[d.status][1]}">${DS[d.status][0]}</span>`;
const bBadge = b => b.reversed ? '<span class="badge b-red">Reversed</span>' : (b.status === 'in_transit' && b.sarConverted > 0) ? `<span class="badge b-blue">Converting · ${Math.floor(b.sarConverted / b.sarTotal * 100)}%</span>` : `<span class="badge ${BS[b.status][1]}">${BS[b.status][0]}</span>`;
const LOCK = '<span class="lock" title="Locked for audit">🔒 locked</span>';

/* ============================ state ============================ */
const KEY = 'xledger-prototype-v3';
let S;
// Premium pricing, per ₹1,000 delivered: the Dubai agent quotes AED per ₹1,000; the customer (Saudi agent)
// is charged SAR per ₹1,000 = Dubai quote + premium. Bigger deals get a smaller premium.
const DEFAULT_SLABS = [{minInr: 0, premium: 2.00}, {minInr: 500000, premium: 1.80}, {minInr: 2000000, premium: 1.50}];
function defaultSettings() {
  return {dubaiQuote: 39.52, sarAedRate: 0.979, marketSarInrRate: 24.77, referenceSarInrRate: 24.77, referenceAedInrRate: 25.30, defaultDistributorFeeInr: 50,
    slabs: DEFAULT_SLABS.map(x => ({...x})), rateLog: []};
}
const slabFor = (inr, slabs = S.settings.slabs) => [...slabs].sort((a, b) => b.minInr - a.minInr).find(x => inr >= x.minInr);
const suggestCustRate = (inr, quote) => R4(quote + (slabFor(inr)?.premium ?? 0));
const R4 = n => Math.round(n * 1e4) / 1e4;
const lakh = n => n >= 100000 ? nfIN.format(n / 100000).replace(/\.00$/, '') + ' lakh' : new Intl.NumberFormat('en-IN').format(n);
function slabLabel(sl) {
  if (!sl) return 'No slab';
  const sorted = [...S.settings.slabs].sort((a, b) => a.minInr - b.minInr), i = sorted.indexOf(sl), next = sorted[i + 1];
  return next ? `₹${lakh(sl.minInr)} – ${lakh(next.minInr)}` : `₹${lakh(sl.minInr)}+`;
}
// a deal's profit in SAR (net INR ÷ the SAR→INR rate it earned) — SAR is how the premium is quoted
const profitSar = c => c.effRate > 0 ? R2(c.net / c.effRate) : 0;
const sarInr = (sar, inr) => `${money(sar, 'SAR')} <span class="muted small">≈ ${money(inr, 'INR')}</span>`;
function emptyState() {
  return {regions: [], parties: [], deals: [], batches: [], allocations: [],
    capital: [], settings: defaultSettings(), counters: {deal: 0, batch: 0, capital: 0}};
}
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() {} // prototype: nothing persists, refresh restores sample data
const party = id => S.parties.find(p => p.id === id);
const pname = id => party(id)?.name ?? '—';
const region = id => S.regions.find(r => r.id === id);
const rname = id => region(id)?.name ?? '—';
const deal = id => S.deals.find(d => d.id === id);
const batch = id => S.batches.find(b => b.id === id);
const activeBatch = b => b && !b.reversed;
class UserError extends Error {}
const fail = m => { throw new UserError(m); };

/* ============================ calc engine ============================ */
function dealCalc(d) {
  // until a distributor is assigned, assume the default delivery fee
  const fee = d.distributorId ? (d.distributorFeeInr || 0) : S.settings.defaultDistributorFeeInr;
  const feeExpected = !d.distributorId;
  const settled = d.inrDubaiYield != null;
  const yieldInr = settled ? d.inrDubaiYield : R2(d.sarAmount * d.estSarInrRate);
  const gross = R2(yieldInr - d.inrPayout);
  return {settled, yieldInr, gross, fee, feeExpected, net: R2(gross - fee),
    effRate: settled ? d.effectiveSarInrRate : d.estSarInrRate};
}
function allocateBatchYield(deals, inrYield) {
  const sarTotal = deals.reduce((s, d) => s + d.sarAmount, 0);
  const r = sarTotal > 0 ? inrYield / sarTotal : 0;
  let assigned = 0;
  return deals.map((d, i) => {
    const y = i === deals.length - 1 ? R2(inrYield - assigned) : R2(d.sarAmount * r);
    assigned = R2(assigned + y);
    return {id: d.id, effectiveRate: R6(r), inrDubaiYield: y};
  });
}

const activeParts = l => (l || []).filter(x => !x.reversed);
function recalcBatch(b) {
  const cv = activeParts(b.conversions), st = activeParts(b.settlements), sum = (l, k) => R2(l.reduce((s, x) => s + x[k], 0));
  b.sarConverted = sum(cv, 'sar'); b.aedAmount = cv.length ? sum(cv, 'aed') : undefined;
  b.sarToAedRate = cv.length ? R6(b.aedAmount / b.sarConverted) : undefined;
  b.aedSettled = sum(st, 'aed'); b.inrYield = st.length ? sum(st, 'inr') : undefined;
  b.aedToInrRate = st.length ? R6(b.inrYield / b.aedSettled) : undefined;
  const wm = st.filter(x => x.marketRate); b.dubaiMargin = wm.length ? R2(wm.reduce((s, x) => s + x.aed * (x.marketRate - x.rate), 0)) : undefined;
}
/* ============================ actions ============================ */
const A = {
  addRegion(name) {
    name = name.trim(); if (!name) fail('Region name is required');
    if (S.regions.some(r => r.name.toLowerCase() === name.toLowerCase())) fail('Region already exists');
    const r = {id: uid(), name}; S.regions.push(r); return r;
  },
  saveParty(f) {
    if (!f.name?.trim()) fail('Name is required');
    if (f.type === 'distributor' && !f.regionId) fail('Distributors need a region');
    if (f.id) { Object.assign(party(f.id), {name: f.name.trim(), phone: f.phone, regionId: f.regionId || undefined, notes: f.notes, active: f.active}); return party(f.id); }
    const p = {id: uid(), type: f.type, name: f.name.trim(), phone: f.phone || '', regionId: f.regionId || undefined, notes: f.notes || '', active: true};
    S.parties.push(p); return p;
  },
  addDeal(f, at = nowISO()) {
    // INR-first: the agent asks for an amount to be delivered in India; SAR to collect = INR ÷ deal rate
    const inr = f.inrAmount != null && f.inrAmount !== '' ? num(f.inrAmount) : num(f.inrK) * 1000;
    const q = num(f.dubaiQuote), c = num(f.sarAedRate), p = num(f.custRate);
    if (!(inr > 0)) fail('Enter the amount to deliver in India');
    if (!(q > 0)) fail("Enter the Dubai agent's quote (AED per ₹1,000)");
    if (!(c > 0)) fail('Enter the SAR → AED rate');
    if (!(p > 0)) fail('Customer rate must be greater than 0');
    if (p > q * 1.3 || p < q * 0.9) fail('Customer rate ' + p + ' is far from the Dubai quote ' + q + ' — check for a typo');
    const sl = slabFor(inr), sug = R4(q + (sl?.premium ?? 0)), sar = R2(inr / 1000 * p);
    const r = 1000 / p, est = 1000 * c / q, override = Math.abs(R4(p) - sug) > 1e-6;
    if (!f.saudiAgentId) fail('Choose a Saudi agent');
    if (!f.recipientName?.trim()) fail('Recipient name is required');
    if (!f.regionId) fail('Choose a delivery region');
    const n = ++S.counters.deal;
    const d = {id: uid(), dealNo: 'D-' + String(n).padStart(4, '0'), dealDate: f.dealDate || at.slice(0, 10),
      saudiAgentId: f.saudiAgentId, sarAmount: R2(sar), dealRate: R6(r),
      dubaiQuote: R4(q), sarAedRate: R6(c), custRate: R4(p), premium: R4(p - q),
      marketRate: R6(est), slab: sl ? {minInr: sl.minInr, premium: sl.premium, label: slabLabel(sl)} : undefined,
      suggestedCustRate: sug, rateOverride: override,
      inrPayout: R2(inr), estSarInrRate: R6(est),
      recipientName: f.recipientName.trim(), recipientPhone: f.recipientPhone || '', recipientAddress: f.recipientAddress || '',
      regionId: f.regionId, distributorFeeInr: 0, status: 'pending_allocation',
      history: [{status: 'pending_allocation', at, note: `Deal logged @ SAR ${rate(p)} per ₹1,000 (Dubai ${rate(q)} AED + premium ${rate(R4(p - q))}${override ? ', slab rate ' + rate(sug) + ' overridden' : ', slab ' + (sl ? slabLabel(sl) : '—')})`}], replacesDealId: f.replacesDealId || undefined, createdAt: at};
    S.deals.push(d); return d;
  },
  cancelDeal(id, reason, at = nowISO()) {
    const d = deal(id);
    if (d.status === 'cancelled') fail('Already cancelled');
    if (d.status === 'completed') fail('A completed payout cannot be cancelled');
    if (d.batchId) fail('This deal is in batch ' + batch(d.batchId).batchNo + '. Reverse the batch first.');
    d.status = 'cancelled'; d.cancelReason = reason || 'Cancelled';
    d.history.push({status: 'cancelled', at, note: d.cancelReason});
  },
  assignDistributor(id, distributorId, fee, at = nowISO()) {
    const d = deal(id);
    if (!['pending_allocation', 'assigned'].includes(d.status)) fail('Can only assign while pending or assigned');
    if (!distributorId) fail('Choose a distributor');
    const f = num(fee); if (isNaN(f) || f < 0) fail('Fee must be 0 or more');
    const re = d.status === 'assigned';
    d.distributorId = distributorId; d.distributorFeeInr = R2(f); d.status = 'assigned';
    d.history.push({status: 'assigned', at, note: (re ? 'Reassigned to ' : 'Assigned to ') + pname(distributorId) + ' · fee ' + money(f, 'INR')});
  },
  advanceDeal(id, at = nowISO()) {
    const d = deal(id);
    const next = {assigned: 'out_for_delivery', out_for_delivery: 'completed'}[d.status];
    if (!next) fail('No next step from ' + DS[d.status][0]);
    d.status = next; d.history.push({status: next, at, note: next === 'completed' ? 'Paid ' + money(d.inrPayout, 'INR') + ' to ' + d.recipientName : ''});
  },
  createBatch(f, at = nowISO()) {
    if (!f.saudiCollectorId) fail('Choose a Saudi collector');
    const ids = f.dealIds || [];
    if (!ids.length) fail('Select at least one deal');
    for (const id of ids) { const d = deal(id); if (d.batchId || d.status === 'cancelled') fail(d.dealNo + ' cannot be batched'); }
    const n = ++S.counters.batch;
    const b = {id: uid(), batchNo: 'B-' + String(n).padStart(4, '0'), createdOn: f.createdOn || at.slice(0, 10),
      saudiCollectorId: f.saudiCollectorId, dealIds: ids.slice(),
      sarTotal: R2(ids.reduce((s, id) => s + deal(id).sarAmount, 0)), status: 'collected_saudi',
      history: [{status: 'collected_saudi', at, note: ids.length + ' deals pooled by ' + pname(f.saudiCollectorId)}], notes: f.notes || ''};
    ids.forEach(id => { deal(id).batchId = b.id; });
    S.batches.push(b); return b;
  },
  batchTransit(id, dubaiCollectorId, at = nowISO()) {
    const b = batch(id); if (b.reversed || b.status !== 'collected_saudi') fail('Batch is not awaiting transit');
    if (!dubaiCollectorId) fail('Choose a Dubai collector');
    b.dubaiCollectorId = dubaiCollectorId; b.status = 'in_transit';
    b.history.push({status: 'in_transit', at, note: 'Handed over to ' + pname(dubaiCollectorId)});
  },
  batchConvert(id, f, at = nowISO()) {
    const b = batch(id); if (b.reversed || b.status !== 'in_transit') fail('Batch is not in transit');
    const left = R2(b.sarTotal - (b.sarConverted || 0));
    const sar = num(f.sar), r = num(f.rate);
    if (!(sar > 0)) fail('Enter the SAR amount converted in this part');
    if (sar > left + 0.004) fail('Only ' + money(left, 'SAR') + ' left to convert');
    if (!(r > 0)) fail('Enter the SAR → AED rate for this part');
    (b.conversions ??= []).push({id: uid(), at, sar: R2(sar), rate: R6(r), aed: R2(sar * r), note: f.note || ''});
    recalcBatch(b);
    b.history.push({status: 'in_transit', at, note: `Converted ${money(sar, 'SAR')} → ${money(R2(sar * r), 'AED')} @ ${rate(r)}`});
    if (b.sarTotal - b.sarConverted < 0.005) { b.status = 'converted_aed'; b.history.push({status: 'converted_aed', at, note: `All SAR converted in ${activeParts(b.conversions).length} part(s) · avg ${rate(b.sarToAedRate)}`}); }
  },
  batchSettle(id, f, at = nowISO()) {
    const b = batch(id); if (b.reversed || !['in_transit', 'converted_aed'].includes(b.status)) fail('Batch cannot be settled now');
    const agentId = b.dubaiAgentId || f.dubaiAgentId; if (!agentId) fail('Choose the Dubai agent');
    const left = R2((b.aedAmount || 0) - (b.aedSettled || 0));
    const aed = num(f.aed), r = num(f.rate), m = f.marketRate ? num(f.marketRate) : undefined;
    if (!(left > 0.004)) fail('No converted AED waiting to be settled');
    if (!(aed > 0)) fail('Enter the AED amount settled in this part');
    if (aed > left + 0.004) fail('Only ' + money(left, 'AED') + ' converted and unsettled');
    if (!(r > 0)) fail('Enter the net AED → INR rate for this part');
    b.dubaiAgentId = agentId;
    (b.settlements ??= []).push({id: uid(), at, aed: R2(aed), rate: R6(r), marketRate: m ? R6(m) : undefined, inr: R2(aed * r), note: f.note || ''});
    recalcBatch(b);
    b.history.push({status: b.status, at, note: `Settled ${money(aed, 'AED')} → ${money(R2(aed * r), 'INR')} @ ${rate(r)}`});
    if (b.status === 'converted_aed' && b.aedAmount - b.aedSettled < 0.005) {
      b.status = 'settled';
      allocateBatchYield(b.dealIds.map(deal), b.inrYield).forEach(x => { const d = deal(x.id); d.effectiveSarInrRate = x.effectiveRate; d.inrDubaiYield = x.inrDubaiYield; });
      b.history.push({status: 'settled', at, note: `Fully settled in ${activeParts(b.settlements).length} part(s) · avg AED→INR ${rate(b.aedToInrRate)} · effective SAR→INR ${rate(b.inrYield / b.sarTotal)} · rates locked`});
    }
  },
  reverseTranche(batchId, kind, trancheId, reason, at = nowISO()) {
    const b = batch(batchId); if (b.status === 'settled') fail('Batch is settled and locked');
    const list = kind === 'conv' ? b.conversions : b.settlements, t = list.find(x => x.id === trancheId);
    if (!t || t.reversed) fail('Part not found or already reversed');
    if (kind === 'conv' && (b.aedAmount - t.aed) < (b.aedSettled || 0) - 0.004) fail('That AED is already settled. Reverse the settlement part first.');
    t.reversed = {at, reason: reason || 'Reversed'};
    recalcBatch(b);
    if (kind === 'conv' && b.status === 'converted_aed') b.status = 'in_transit';
    b.history.push({status: b.status, at, note: `Reversed ${kind === 'conv' ? 'conversion' : 'settlement'} part (${kind === 'conv' ? money(t.sar, 'SAR') : money(t.aed, 'AED')} @ ${rate(t.rate)}): ${t.reversed.reason}`});
  },
  reverseBatch(id, reason, at = nowISO()) {
    const b = batch(id);
    if (b.reversed) fail('Already reversed');
    if (b.status === 'settled') fail('Settled batches are locked. Settled-batch reversal is still an open question for the client.');
    if (activeParts(b.conversions).length) fail('Reverse its conversion and settlement parts first');
    b.reversed = {at, reason: reason || 'Reversed'};

function deriveLedger() {
  const E = [];
  const add = (date, partyId, cur, amt, memo, ref, rev) => { if (partyId && Math.abs(amt) > 0.0001) E.push({date, partyId, cur, amt: R2(amt), memo, ref, rev: !!rev}); };
  for (const d of S.deals) {
    const ref = {kind: 'deal', id: d.id, no: d.dealNo};
    add(d.createdAt, d.saudiAgentId, 'SAR', d.sarAmount, 'Collected from customer for ' + d.recipientName, ref);
    if (d.status === 'cancelled') add(d.history.at(-1).at, d.saudiAgentId, 'SAR', -d.sarAmount, 'Reversal: ' + d.cancelReason, ref, true);
    if (d.status === 'completed') {
      const at = d.history.find(h => h.status === 'completed').at;
      add(at, d.distributorId, 'INR', -d.inrPayout, 'Paid to recipient ' + d.recipientName, ref);
      add(at, d.distributorId, 'INR', -d.distributorFeeInr, 'Delivery fee retained', ref);
    }
  }
  for (const b of S.batches) {
    const ref = {kind: 'batch', id: b.id, no: b.batchNo};
    const at = s => b.history.find(h => h.status === s)?.at;
    const L = [];
    const push = (...a) => L.push(a);
    if (at('collected_saudi')) {
      b.dealIds.forEach(id => { const d = deal(id); push(at('collected_saudi'), d.saudiAgentId, 'SAR', -d.sarAmount, 'Handed to collector (' + d.dealNo + ')'); });
      push(at('collected_saudi'), b.saudiCollectorId, 'SAR', b.sarTotal, 'Pooled ' + b.dealIds.length + ' deals');
    }
    if (at('in_transit')) {
      push(at('in_transit'), b.saudiCollectorId, 'SAR', -b.sarTotal, 'Handed to ' + pname(b.dubaiCollectorId));
      push(at('in_transit'), b.dubaiCollectorId, 'SAR', b.sarTotal, 'Received from ' + pname(b.saudiCollectorId));
    }
    L.forEach(x => add(x[0], x[1], x[2], x[3], x[4], ref));
    if (b.reversed) L.forEach(x => add(b.reversed.at, x[1], x[2], -x[3], 'Reversal: ' + b.reversed.reason, ref, true));
    const part = (t, rows) => { rows.forEach(x => add(t.at, ...x, ref)); if (t.reversed) rows.forEach(x => add(t.reversed.at, x[0], x[1], -x[2], 'Reversal: ' + t.reversed.reason, ref, true)); };
    (b.conversions || []).forEach(c => part(c, [
      [b.dubaiCollectorId, 'SAR', -c.sar, `Converted part @ ${rate(c.rate)}`],
      [b.dubaiCollectorId, 'AED', c.aed, `From ${money(c.sar, 'SAR')} @ ${rate(c.rate)}`]]));
    (b.settlements || []).forEach(t => part(t, [
      [b.dubaiCollectorId, 'AED', -t.aed, 'Handed to ' + pname(b.dubaiAgentId)],
      [b.dubaiAgentId, 'AED', t.aed, 'Received from ' + pname(b.dubaiCollectorId)],
      [b.dubaiAgentId, 'AED', -t.aed, `Converted to INR @ ${rate(t.rate)}`],
      [b.dubaiAgentId, 'INR', t.inr, 'INR payable to India']]));
  }
  for (const a of S.allocations) {
    const b = batch(a.batchId); const ref = {kind: 'batch', id: b.id, no: b.batchNo};
    add(a.date, b.dubaiAgentId, 'INR', -a.inrAmount, 'Paid to ' + pname(a.distributorId), ref);
    add(a.date, a.distributorId, 'INR', a.inrAmount, 'Received from ' + pname(b.dubaiAgentId), ref);
  }
  for (const c of S.capital) {
    const ref = {kind: 'capital', id: c.id, no: c.no};
    if (c.kind === 'add') add(c.date, c.partyId, c.currency, c.amount, 'Capital added by operator' + (c.note ? ' · ' + c.note : ''), ref);
    if (c.kind === 'withdraw') add(c.date, c.partyId, c.currency, -c.amount, 'Capital withdrawn by operator' + (c.note ? ' · ' + c.note : ''), ref);
    if (c.kind === 'transfer') { add(c.date, c.partyId, c.currency, -c.amount, 'Moved to ' + pname(c.toPartyId) + (c.note ? ' · ' + c.note : ''), ref); add(c.date, c.toPartyId, c.currency, c.amount, 'Operator funds from ' + pname(c.partyId) + (c.note ? ' · ' + c.note : ''), ref); }
  }
  return E.sort((x, y) => x.date.localeCompare(y.date));
}

function trend(vals) {
  const h = Math.floor(vals.length / 2), a = vals.slice(0, h).reduce((s, v) => s + v, 0), b = vals.slice(h).reduce((s, v) => s + v, 0);
  if (!a) return b ? {cls: 'up', txt: 'new this week'} : {cls: '', txt: 'no activity'};
  const pct = (b - a) / a * 100;
  return {cls: pct >= 0 ? 'up' : 'down', txt: `${icon(pct >= 0 ? 'up' : 'down')}${Math.abs(pct).toFixed(1)}% vs prior 7 days`};
}
let CHART = null;
function barChart(labels, s1, s2, n1, n2) {
  const W = 800, H = 260, L = 52, B = 26, T = 8, max0 = Math.max(1, ...s1, ...s2);
  const mag = Math.pow(10, Math.floor(Math.log10(max0))), max = Math.ceil(max0 / mag / 2) * mag * 2 || 1;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const cw = (W - L) / labels.length, bw = Math.min(26, cw * .32);
  const y = v => T + (H - T - B) * (1 - v / max);
  CHART = {labels, s1, s2, n1, n2};
  let g = ticks.map(t => `<line class="gl" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 10}" y="${y(t) + 4}" text-anchor="end">${t ? '₹' + nfC.format(t) : '0'}</text>`).join('');
  labels.forEach((lb, i) => {
    const x = L + i * cw + cw / 2;
    g += `<rect class="hit" data-ci="${i}" x="${L + i * cw + 2}" y="${T}" width="${cw - 4}" height="${H - T - B}" rx="6"/>`;
    if (s1[i]) g += `<rect class="b1" x="${x - bw - 2}" y="${y(s1[i])}" width="${bw}" height="${H - B - y(s1[i])}" rx="5" pointer-events="none"/>`;
    if (s2[i]) g += `<rect class="b2" x="${x + 2}" y="${y(s2[i])}" width="${bw}" height="${H - B - y(s2[i])}" rx="5" pointer-events="none"/>`;
    if (labels.length <= 16 || i % 2 === 0) g += `<text class="ax" x="${x}" y="${H - 6}" text-anchor="middle">${new Date(lb + 'T00:00:00').getDate()}</text>`;
  });
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(n1)} vs ${esc(n2)} by day">${g}</svg><div class="tip" id="tip"></div></div>`;
}

  const done = live.filter(d => d.status === 'completed');
  const inrDist = done.reduce((s, d) => s + d.inrPayout, 0);

  const est = live.filter(d => d.inrDubaiYield == null).reduce((s, d) => s + dealCalc(d).net, 0);
  const owed = live.filter(d => d.status !== 'completed').reduce((s, d) => s + d.inrPayout, 0);
  const sumType = (type, cur) => partiesOf(type, true).reduce((s, p) => s + (bal[p.id]?.[cur] || 0), 0);
  const POS = position();
  // daily series
  const days = lastDays(14);
  const byDay = (fn) => days.map(day => fn(day));
  const sarD = byDay(day => live.filter(d => d.dealDate === day).reduce((s, d) => s + d.sarAmount, 0));
  const promD = byDay(day => live.filter(d => d.dealDate === day).reduce((s, d) => s + d.inrPayout, 0));
  const compAt = d => d.history.find(h => h.status === 'completed')?.at.slice(0, 10);
  const paidD = byDay(day => done.filter(d => compAt(d) === day).reduce((s, d) => s + d.inrPayout, 0));
  const profD = byDay(day => live.filter(d => d.dealDate === day).reduce((s, d) => s + dealCalc(d).net, 0));
  const t1 = trend(sarD), t2 = trend(paidD);
  // alerts
  const pend = live.filter(d => d.status === 'pending_allocation').length;
  const unb = live.filter(d => !d.batchId).length;
  const transit = S.batches.filter(b => activeBatch(b) && b.status !== 'settled').length;

  const promTot = promD.reduce((s, v) => s + v, 0), paidTot = paidD.reduce((s, v) => s + v, 0);
  const counts = Object.fromEntries(Object.keys(DS).map(k => [k, S.deals.filter(d => d.status === k).length]));
  const bcount = Object.fromEntries(BS_FLOW.map(k => [k, S.batches.filter(b => activeBatch(b) && b.status === k).length]));
  const maxC = Math.max(1, ...Object.values(counts));
  const balRows = HOLDER_ORDER.flatMap(type => partiesOf(type, true).map(p => {
    const b = bal[p.id] || {SAR: 0, AED: 0, INR: 0};
    if (!b.SAR && !b.AED && !b.INR) return '';
    return `<tr><td>${partyLink(p.id)}<div class="small muted">${PT1[type]}</div></td><td class="num">${b.SAR ? money(b.SAR, 'SAR') : '—'}</td><td class="num">${b.AED ? money(b.AED, 'AED') : '—'}</td><td class="num">${b.INR ? money(b.INR, 'INR') : '—'}</td></tr>`;
  })).join('');
  const recent = [...S.deals].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 6);
  return `
  ${alerts.length ? `<div class="alert">${icon('alert')}<b>${alerts.length} item${alerts.length > 1 ? 's' : ''} need your attention</b><span class="sep">·</span><span class="muted">${alerts.join(' · ')}</span></div>` : ''}
  <div class="strip">
    <div class="cell"><div class="l">Total SAR collected</div><div class="v">${cmp(sar, 'SAR')}</div>${sparkline(sarD)}<div class="s ${t1.cls}">${t1.txt}</div></div>
    <div class="cell"><div class="l">INR from Dubai agent</div><div class="v">${cmp(inrY, 'INR')}</div>${sparkline(byDay(day => settledB.filter(b => b.history.at(-1).at.slice(0, 10) === day).reduce((s, b) => s + b.inrYield, 0)))}<div class="s">${settledB.length} settled batch${settledB.length === 1 ? '' : 'es'}</div></div>
    <div class="cell"><div class="l">INR distributed</div><div class="v">${cmp(inrDist, 'INR')}</div>${sparkline(paidD)}<div class="s ${t2.cls}">${t2.txt}</div></div>
    <div class="cell"><div class="l">Operator net profit</div><div class="v">${cmp(realised, 'INR')}</div>${sparkline(profD)}<div class="s">+ ${money(est, 'INR')} estimated (unsettled)</div></div>
  </div>
  <div class="card">
    <div class="cardh"><h2>INR promised vs paid out · last 14 days</h2><a class="link" href="#/reports">View full report</a></div>
    <div class="bigvals">
      <div class="bv"><div class="v">₹${nfC.format(promTot)}</div><div class="k"><i class="sw" style="background:var(--accent)"></i>INR promised (new deals)</div></div>
      <div class="bv"><div class="v">₹${nfC.format(paidTot)}</div><div class="k"><i class="sw" style="background:var(--accent-2)"></i>INR paid to recipients</div></div>
      <span style="margin-left:auto" class="pill" title="INR promised to recipients and not yet paid">${money(owed, 'INR')} still owed</span>
    </div>
    ${barChart(days, promD, paidD, 'Promised', 'Paid out')}
  </div>
  <div class="grid g2">
    <div class="card"><div class="cardh"><h2>Capital &amp; balances</h2><a class="link" href="#/capital">Open capital</a></div>

    <div class="card"><h2>Pipeline</h2>

      <div class="row" style="margin-top:14px">${BS_FLOW.map(k => `<span class="badge ${BS[k][1]}">${BS[k][0]}: ${bcount[k]}</span>`).join('')}</div>
    </div>
  </div>

    <div class="small muted" style="margin-top:10px">Positive = party holds money or owes it to the operator. Balances are calculated from ledger entries, never typed in.</div></div>

    <td>${esc(d.recipientName)}<div class="small muted">${esc(rname(d.regionId))}</div></td>
    <td class="num">${money(d.inrPayout, 'INR')}</td><td class="num">${rate(d.custRate)}${d.rateOverride ? ' <span title="Manual premium" style="color:var(--warn)">●</span>' : ''}<div class="small muted">${rate(d.dubaiQuote)} + ${rate(d.premium)}</div></td><td class="num">${money(d.sarAmount, 'SAR')}</td>
    <td class="num">${d.status === 'cancelled' ? '—' : signed(profitSar(c), 'SAR') + `<div class="small muted">≈ ${money(c.net, 'INR')} · ${c.settled ? 'actual' : 'est.'}</div>`}</td>

  let foot = '';
  if (showFoot) {
    const l = list.filter(d => d.status !== 'cancelled');

function pageBatch(id) {
  const b = batch(id); if (!b) return notFound();
  const ds = b.dealIds.map(deal);
  const payout = ds.reduce((s, d) => s + d.inrPayout, 0);
  const fees = ds.reduce((s, d) => s + dealCalc(d).fee, 0);
  const settled = b.status === 'settled';
  const allocs = S.allocations.filter(a => a.batchId === b.id);
  const allocated = allocs.reduce((s, a) => s + a.inrAmount, 0);
  const margin = b.dubaiMargin ?? null;
  let panel = '';
  if (b.reversed) panel = `<div class="card"><h2>Reversed</h2><div class="muted">${fdt(b.reversed.at)} · ${esc(b.reversed.reason)}. Its deals were released and can go into a new batch.</div></div>`;
  else if (b.status === 'collected_saudi') panel = `<div class="card"><h2>Step 2 · Hand over to Dubai collector</h2>
    <form data-form="transit" data-id="${b.id}" class="row"><select name="dubaiCollectorId" style="flex:1 1 220px">${opts(partiesOf('dubai_collector'), '', 'Choose Dubai collector')}</select><button class="btn pri">Mark in transit</button></form></div>`;
  else {
    const sarLeft = R2(b.sarTotal - (b.sarConverted || 0)), aedLeft = R2((b.aedAmount || 0) - (b.aedSettled || 0));
    const pc = (x, y) => y > 0 ? Math.min(100, x / y * 100) : 0;
    const agentField = b.dubaiAgentId ? `<label class="f">Dubai agent<input value="${esc(pname(b.dubaiAgentId))}" disabled></label>` : `<label class="f">Dubai agent<select name="dubaiAgentId">${opts(partiesOf('dubai_agent'), partiesOf('dubai_agent')[0]?.id)}</select></label>`;
    const forms = settled ? '' : `<div class="grid g2" style="margin-top:16px">
      <div>${sarLeft > 0.004 ? `<form data-form="convert" data-live="convert" data-id="${b.id}"><h2 style="font-size:14px">Record a conversion part · SAR → AED</h2><div class="fg">

      <div>${aedLeft > 0.004 ? `<form data-form="settle" data-live="settle" data-id="${b.id}"><h2 style="font-size:14px">Record a settlement part · AED → INR</h2><div class="fg">
          ${agentField}

    </div>`;
    const partRow = (kind, t, cols) => `<tr class="${t.reversed ? 'dim' : ''}"><td>${fdt(t.at)}</td>${cols}<td class="small">${esc(t.note) || ''}${t.reversed ? `<div class="neg">Reversed: ${esc(t.reversed.reason)}</div>` : ''}</td><td class="num">${!settled && !t.reversed ? `<button class="btn sm dan" data-act="reverseTranche" data-id="${b.id}" data-kind="${kind}" data-tid="${t.id}">Reverse</button>` : ''}</td></tr>`;
    panel = `<div class="card"><div class="cardh"><h2>Conversion &amp; settlement in parts</h2>${settled ? LOCK : '<span class="small muted">Locks when all SAR is converted and all AED settled</span>'}</div>
      <div class="grid g2">
        <div><div class="row small" style="justify-content:space-between"><span>SAR converted</span><span class="num">${money(b.sarConverted || 0, 'SAR')} / ${money(b.sarTotal, 'SAR')}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pc(b.sarConverted, b.sarTotal)}%"></i></div><div class="small muted" style="margin-top:4px">avg SAR → AED ${rate(b.sarToAedRate)}</div></div>
        <div><div class="row small" style="justify-content:space-between"><span>AED settled</span><span class="num">${money(b.aedSettled || 0, 'AED')} / ${money(b.aedAmount || 0, 'AED')}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pc(b.aedSettled, b.aedAmount)}%"></i></div><div class="small muted" style="margin-top:4px">avg AED → INR ${rate(b.aedToInrRate)}</div></div>
      </div>
      ${forms}
      ${(b.conversions || []).length ? `<h2 style="font-size:14px;margin-top:18px">Conversion parts</h2><div class="tw"><table><thead><tr><th>When</th><th class="num">SAR</th><th class="num">Rate</th><th class="num">AED</th><th>Note</th><th></th></tr></thead><tbody>
        ${b.conversions.map(t => partRow('conv', t, `<td class="num">${money(t.sar, 'SAR')}</td><td class="num">${rate(t.rate)}</td><td class="num">${money(t.aed, 'AED')}</td>`)).join('')}</tbody></table></div>` : ''}
      ${(b.settlements || []).length ? `<h2 style="font-size:14px;margin-top:18px">Settlement parts · ${esc(pname(b.dubaiAgentId))}</h2><div class="tw"><table><thead><tr><th>When</th><th class="num">AED</th><th class="num">AED /₹1000</th><th class="num">Market</th><th class="num">INR</th><th>Note</th><th></th></tr></thead><tbody>
        ${b.settlements.map(t => partRow('settle', t, `<td class="num">${money(t.aed, 'AED')}</td><td class="num">${rate(R4(1000 / t.rate))}</td><td class="num">${t.marketRate ? rate(R4(1000 / t.marketRate)) : '—'}</td><td class="num">${money(t.inr, 'INR')}</td>`)).join('')}</tbody></table></div>` : ''}
    </div>`;
    if (b.inrYield > 0) panel += `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">INR paid by Dubai agent to distributors</h2><button class="btn pri sm" data-act="addAlloc" data-id="${b.id}" ${allocated >= b.inrYield - 0.004 ? 'disabled' : ''}>+ Record payment</button></div>
    <div style="margin:12px 0"><div class="bar"><i style="width:${Math.min(100, allocated / b.inrYield * 100)}%"></i></div><div class="small muted" style="margin-top:4px">${money(allocated, 'INR')} of ${money(b.inrYield, 'INR')} paid out · ${money(b.inrYield - allocated, 'INR')} still with Dubai agent</div></div>
    <div class="tw"><table><thead><tr><th>Date</th><th>Distributor</th><th>Note</th><th class="num">INR</th></tr></thead><tbody>${allocs.map(a => `<tr><td>${fdt(a.date)}</td><td>${partyLink(a.distributorId)}</td><td>${esc(a.note) || '<span class="muted">—</span>'}</td><td class="num">${money(a.inrAmount, 'INR')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No payments recorded yet</td></tr>'}</tbody></table></div></div>`;
  }
  return `
  <div class="crumb"><a href="#/batches">Transit Batches</a> / ${b.batchNo}</div>
  <div class="head"><div><h1>Batch ${b.batchNo}</h1><div class="row" style="margin-top:6px">${bBadge(b)} ${settled ? LOCK : ''}<span class="small muted">Created ${fdate(b.createdOn)}</span></div></div>
    <div class="row">${!b.reversed && !settled ? `<button class="btn dan" data-act="reverseBatch" data-id="${b.id}">Reverse batch</button>` : ''}</div></div>
  ${b.reversed ? '' : steps(BS_FLOW, BS, b.status)}
  <div class="card"><h2>SAR → AED → INR side by side</h2>
    <div class="chain">
      <div class="c"><div class="l">SAR pooled</div><div class="v">${money(b.sarTotal, 'SAR')}</div><div class="r">${esc(pname(b.saudiCollectorId))} → ${esc(b.dubaiCollectorId ? pname(b.dubaiCollectorId) : '…')}</div></div>
      <div class="c"><div class="l">AED converted</div><div class="v">${money(b.aedAmount, 'AED')}</div><div class="r">avg SAR → AED ${rate(b.sarToAedRate)} · ${activeParts(b.conversions).length} part(s)</div></div>
      <div class="c"><div class="l">INR from Dubai agent</div><div class="v">${money(b.inrYield, 'INR')}</div><div class="r">avg AED → INR ${rate(b.aedToInrRate)} · ${activeParts(b.settlements).length} part(s)</div></div>
      <div class="c"><div class="l">Effective SAR → INR</div><div class="v">${settled ? rate(b.inrYield / b.sarTotal) : '—'}</div><div class="r">avg deal rate ${rate(payout / b.sarTotal)}</div></div>
    </div>
    ${settled ? `<div class="grid g3" style="margin-top:14px">
      <div class="kpi"><div class="l">INR promised to recipients</div><div class="v">${money(payout, 'INR')}</div></div>
      <div class="kpi"><div class="l">Gross spread − fees</div><div class="v">${money(b.inrYield - payout, 'INR')} − ${money(fees, 'INR')}</div></div>
      <div class="kpi"><div class="l">Operator net profit</div><div class="v pos">${money(b.inrYield - payout - fees, 'INR')}</div>${margin != null ? `<div class="s">Dubai agent margin ${money(margin, 'INR')}</div>` : ''}</div>
    </div>` : ''}
  </div>
  ${panel}
  <div class="card"><h2>Deals in this batch</h2>${dealTable(ds, true)}</div>
  <div class="card"><h2>History</h2>${b.history.slice().reverse().map(h => `<div class="hist"><div class="row"><span class="badge ${BS[h.status][1]}">${BS[h.status][0]}</span><span class="small muted">${fdt(h.at)}</span></div><div class="small">${esc(h.note || '')}</div></div>`).join('')}</div>`;
}

function pageParty(id) {
  const p = party(id); if (!p) return notFound();
  const E = deriveLedger().filter(e => e.partyId === id);
  const curs = ['SAR', 'AED', 'INR'].filter(c => E.some(e => e.cur === c));
  const ledgers = curs.map(c => {
    let run = 0;
    const rows = E.filter(e => e.cur === c).map(e => { run = R2(run + e.amt);
      const link = e.ref.kind === 'deal' ? `<a href="#/deal/${e.ref.id}">${e.ref.no}</a>` : e.ref.kind === 'capital' ? `<a href="#/capital">${e.ref.no}</a>` : `<a href="#/batch/${e.ref.id}">${e.ref.no}</a>`;
      return `<tr class="${e.rev ? 'dim' : ''}"><td>${fdt(e.date)}</td><td>${link}</td><td>${esc(e.memo)}</td><td class="num">${e.amt > 0 ? money(e.amt, c) : ''}</td><td class="num">${e.amt < 0 ? money(-e.amt, c) : ''}</td><td class="num"><b>${money(run, c)}</b></td></tr>`; });
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${c} ledger</h2><span>Balance <b>${signed(run, c)}</b></span></div>
      <div class="tw" style="margin-top:10px"><table class="ledger"><thead><tr><th>Date</th><th>Ref</th><th>Description</th><th class="num">In (+)</th><th class="num">Out (−)</th><th class="num">Balance</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
  }).join('');
  const myDeals = p.type === 'saudi_agent' ? S.deals.filter(d => d.saudiAgentId === id) : p.type === 'distributor' ? S.deals.filter(d => d.distributorId === id) : [];
  return `
  <div class="crumb"><a href="#/parties" data-act="partyTab" data-tab="${p.type}">Parties</a> / ${esc(p.name)}</div>
  <div class="head"><div><h1>${esc(p.name)}</h1><div class="row small muted" style="margin-top:4px"><span class="badge">${PT1[p.type]}</span>${esc(p.phone)}${p.regionId ? ' · ' + esc(rname(p.regionId)) : ''}${p.notes ? ' · ' + esc(p.notes) : ''}</div></div>
    <button class="btn" data-act="editParty" data-id="${p.id}">Edit</button></div>
  ${ledgers || '<div class="card empty">No transactions yet</div>'}
  ${myDeals.length ? `<div class="card"><h2>${p.type === 'saudi_agent' ? 'Deals booked' : 'Payouts assigned'}</h2>${dealTable(myDeals, true)}</div>` : ''}`;
}

function reportData() {
  const r = UI.report;
  const ds = S.deals.filter(d => d.status !== 'cancelled' && (!r.from || d.dealDate >= r.from) && (!r.to || d.dealDate <= r.to));
  const key = {agent: d => pname(d.saudiAgentId), region: d => rname(d.regionId), dist: d => d.distributorId ? pname(d.distributorId) : 'Unassigned',
    batch: d => d.batchId ? batch(d.batchId).batchNo : 'Not batched', status: d => DS[d.status][0], date: d => d.dealDate}[r.group];
  const g = new Map();
  for (const d of ds) {
    const k = key(d); const c = dealCalc(d);
    const x = g.get(k) || {k, n: 0, sar: 0, payout: 0, yieldA: 0, sarA: 0, fees: 0, real: 0, est: 0, mktInr: 0};
    x.mktInr += d.sarAmount * d.marketRate;
    x.n++; x.sar += d.sarAmount; x.payout += d.inrPayout; x.fees += c.fee;
    if (c.settled) { x.real += c.net; x.yieldA += c.yieldInr; x.sarA += d.sarAmount; } else x.est += c.net;
    g.set(k, x);
  }
  return [...g.values()].sort((a, b) => String(a.k).localeCompare(String(b.k)));
}
function pageReports() {
  const r = UI.report, rows = reportData();
  const tot = rows.reduce((t, x) => { for (const k of ['n', 'sar', 'payout', 'yieldA', 'sarA', 'fees', 'real', 'est', 'mktInr']) t[k] += x[k]; return t; }, {n: 0, sar: 0, payout: 0, yieldA: 0, sarA: 0, fees: 0, real: 0, est: 0, mktInr: 0});
  const tr = (x, foot) => `<tr><td>${foot ? 'Total' : esc(x.k)}</td><td class="num">${x.n}</td><td class="num">${money(x.sar, 'SAR')}</td><td class="num">${rate(x.mktInr / x.sar)}</td><td class="num">${rate(x.payout / x.sar)}</td><td class="num">${x.sarA ? rate(x.yieldA / x.sarA) : '—'}</td><td class="num">${money(x.payout, 'INR')}</td><td class="num">${money(x.fees, 'INR')}</td><td class="num">${signed(x.real, 'INR')}</td><td class="num">${money(x.est, 'INR')}</td></tr>`;
  const bs = S.batches.filter(b => activeBatch(b) && b.status === 'settled' && (!r.from || b.createdOn >= r.from) && (!r.to || b.createdOn <= r.to));
  const G = {agent: 'Saudi agent', region: 'Region', dist: 'Distributor', batch: 'Batch', status: 'Status', date: 'Deal date'};
  return `
  <div class="head"><div><h1>Reports</h1><div class="muted small">Operator profit and rate difference across deals and date ranges</div></div>
    <button class="btn" data-act="exportCsv">Export CSV</button></div>
  <div class="card"><div class="filters">
    <label class="f">From<input type="date" data-filter="report.from" value="${r.from}"></label>
    <label class="f">To<input type="date" data-filter="report.to" value="${r.to}"></label>
    <label class="f">Group by<select data-filter="report.group">${Object.entries(G).map(([k, v]) => `<option value="${k}" ${r.group === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
  <h2>Profit by ${G[r.group].toLowerCase()}</h2>
  <div class="tw"><table><thead><tr><th>${G[r.group]}</th><th class="num">Deals</th><th class="num">SAR</th><th class="num">Est. ₹ per SAR</th><th class="num">Customer ₹ per SAR</th><th class="num">Actual ₹ per SAR</th><th class="num">INR payout</th><th class="num">Fees</th><th class="num">Realised profit</th><th class="num">Estimated (unsettled)</th></tr></thead>
  <tbody>${rows.map(x => tr(x)).join('') || '<tr><td colspan="10" class="empty">No deals in range</td></tr>'}</tbody>${rows.length ? `<tfoot>${tr(tot, true)}</tfoot>` : ''}</table></div></div>
  <div class="card"><h2>Rate difference by settled batch</h2>
  <div class="tw"><table><thead><tr><th>Batch</th><th class="num">SAR</th><th class="num">SAR→AED</th><th class="num">AED→INR net</th><th class="num">Effective SAR→INR</th><th class="num">Avg deal rate</th><th class="num">Spread / SAR</th><th class="num">Dubai agent margin</th><th class="num">Net profit</th></tr></thead><tbody>
  ${bs.map(b => { const ds = b.dealIds.map(deal); const pay = ds.reduce((s, d) => s + d.inrPayout, 0), fee = ds.reduce((s, d) => s + dealCalc(d).fee, 0);
    const eff = b.inrYield / b.sarTotal, avg = pay / b.sarTotal;
    return `<tr><td>${batchLink(b)}</td><td class="num">${money(b.sarTotal, 'SAR')}</td><td class="num">${rate(b.sarToAedRate)}</td><td class="num">${rate(b.aedToInrRate)}</td><td class="num">${rate(eff)}</td><td class="num">${rate(avg)}</td><td class="num">${rate(eff - avg)}</td><td class="num">${b.dubaiMargin != null ? money(b.dubaiMargin, 'INR') : '—'}</td><td class="num">${signed(b.inrYield - pay - fee, 'INR')}</td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">No settled batches in range</td></tr>'}
  </tbody></table></div></div>`;
}

/* ============================ capital & position ============================ */
const HOLDER_ORDER = ['operator', 'saudi_agent', 'saudi_collector', 'dubai_collector', 'dubai_agent', 'distributor'];
function toInr(cur, amt) { const st = S.settings; return cur === 'INR' ? amt : cur === 'SAR' ? amt * st.referenceSarInrRate : amt * st.referenceAedInrRate; }
function position() {
  const bal = balances(deriveLedger());
  const debtors = [], creditors = [], operatorCash = {SAR: 0, AED: 0, INR: 0, val: 0};
  for (const type of HOLDER_ORDER) for (const p of partiesOf(type, true)) {
    const b = bal[p.id]; if (!b) continue;
    for (const c of ['SAR', 'AED', 'INR']) {
      const a = b[c]; if (Math.abs(a) < 0.005) continue;
      if (type === 'operator') { operatorCash[c] += a; operatorCash.val += toInr(c, a); continue; }
      (a > 0 ? debtors : creditors).push({kind: 'party', partyId: p.id, type, cur: c, amt: Math.abs(a), val: toInr(c, Math.abs(a)),
        why: a > 0 ? BAL_LABEL[type][1] : 'Paid out more than received'});
    }
  }
  const open = S.deals.filter(d => !['cancelled', 'completed'].includes(d.status));
  const today = new Date(todayStr() + 'T00:00:00');
  open.forEach(d => creditors.push({kind: 'recipient', deal: d, cur: 'INR', amt: d.inrPayout, val: d.inrPayout,
    age: Math.round((today - new Date(d.dealDate + 'T00:00:00')) / 864e5)}));
  const feeBy = new Map();
  open.forEach(d => { const c = dealCalc(d); const k = d.distributorId || ''; feeBy.set(k, (feeBy.get(k) || 0) + c.fee); });
  feeBy.forEach((amt, k) => amt > 0 && creditors.push({kind: 'fee', partyId: k || null, cur: 'INR', amt, val: amt}));
  const sum = (l, f = () => true) => R2(l.filter(f).reduce((s, x) => s + x.val, 0));
  const capital = R2(S.capital.reduce((s, c) => s + (c.kind === 'add' ? 1 : c.kind === 'withdraw' ? -1 : 0) * toInr(c.currency, c.amount), 0));
  const live = S.deals.filter(d => d.status !== 'cancelled');
  const realised = R2(live.filter(d => d.inrDubaiYield != null).reduce((s, d) => s + dealCalc(d).net, 0));
  const estimated = R2(live.filter(d => d.inrDubaiYield == null).reduce((s, d) => s + dealCalc(d).net, 0));
  const cash = R2(operatorCash.val), dTot = sum(debtors), cTot = sum(creditors);
  const net = R2(cash + dTot - cTot);
  return {debtors, creditors, operatorCash, cash, dTot, cTot, net, capital, realised, estimated, unrealised: R2(net - capital - realised),
    recipientsTot: sum(creditors, x => x.kind === 'recipient'), feesTot: sum(creditors, x => x.kind === 'fee'), partyCredTot: sum(creditors, x => x.kind === 'party')};
}
function moneyMulti(rows) {
  const by = {}; rows.forEach(r => by[r.cur] = (by[r.cur] || 0) + r.amt);
  return Object.entries(by).map(([c, a]) => money(a, c)).join(' · ') || '—';
}

  </tbody></table></div></div>`;

const LIVE = {
  deal(f, target) {
    const el = document.getElementById('pv-deal'); if (!el) return;
    const dr = f.custRate;
    if (target === dr) dr.dataset.auto = '0';
    const inr = R2(num(f.inrK.value) * 1000), q = num(f.dubaiQuote.value), c = num(f.sarAedRate.value), fee = S.settings.defaultDistributorFeeInr;
    document.getElementById('inrWords').textContent = inr > 0 ? '= ' + money(inr, 'INR') : '';
    const sl = inr > 0 ? slabFor(inr) : null, sug = inr > 0 && q > 0 ? suggestCustRate(inr, q) : NaN;
    if (dr.dataset.auto === '1' && sug > 0) dr.value = sug;
    const p = num(dr.value);
    document.getElementById('rateMode').innerHTML = dr.dataset.auto === '1' ? '· slab premium' : (sug > 0 && Math.abs(p - sug) > 1e-6 ? '<span style="color:var(--warn)">· manual premium</span>' : '· manual');
    if (!(inr > 0 && p > 0 && q > 0 && c > 0)) { el.innerHTML = '<span class="muted">Enter the ₹ amount and rates to preview</span>'; return; }
    const k = inr / 1000, sar = R2(k * p), aedCost = R2(k * q), sarCost = R2(aedCost / c), feeSar = R2(fee * q / 1000 / c);
    const profit = R2(sar - sarCost - feeSar), perK = R4(p - q / c), est = 1000 * c / q, net = R2(sar * est - inr - fee);
    const warn = p > q * 1.3 || p < q * 0.9;
    el.innerHTML = `<div class="small muted" style="margin-bottom:6px">Slab <b style="color:var(--text)">${sl ? slabLabel(sl) : '—'}</b> · Dubai ${rate(q)} + premium ${rate(R4(p - q))} = <b style="color:var(--text)">${rate(p)}</b></div>
      <dl class="kv"><dt>Deliver in India</dt><dd><b>${money(inr, 'INR')}</b></dd>
      <dt>SAR to collect (${R4(k)} × ${rate(p)})</dt><dd><b>${money(sar, 'SAR')}</b></dd>
      <dt>Dubai cost (${R4(k)} × ${rate(q)} AED)</dt><dd>${money(aedCost, 'AED')}</dd>
      <dt>…in SAR (÷ ${rate(c)})</dt><dd>${money(sarCost, 'SAR')}</dd>
      <dt>Distributor fee ${money(fee, 'INR')}</dt><dd>${money(feeSar, 'SAR')}</dd>
      <dt>Profit per ₹1,000 (${rate(p)} − ${rate(q)} ÷ ${rate(c)})</dt><dd>${money(perK, 'SAR')}</dd>
      <dt>Est. net profit</dt><dd class="${profit >= 0 ? 'pos' : 'neg'}"><b>${money(profit, 'SAR')}</b><div class="small muted">≈ ${money(net, 'INR')}</div></dd></dl>
      ${warn ? '<div class="small neg" style="margin-top:6px">Customer rate is far from the Dubai quote — check for a typo</div>' : ''}${profit < 0 ? '<div class="small neg" style="margin-top:6px">This deal loses money at this Dubai quote</div>' : ''}`;
  },
  convert(f) {
    const sar = num(f.sar.value), r = num(f.rate.value), el = document.getElementById('pv-convert');
    el.innerHTML = sar > 0 && r > 0 ? `<dl class="kv"><dt>${money(sar, 'SAR')} × ${rate(r)}</dt><dd><b>${money(R2(sar * r), 'AED')}</b></dd></dl>` : '<span class="muted">Enter SAR and rate to preview AED</span>';
  },
  settle(f) {
    const b = batch(f.dataset.id), aed = num(f.aed.value), qv = num(f.quote.value), mq = num(f.marketQuote.value), r = qv > 0 ? 1000 / qv : 0, m = mq > 0 ? 1000 / mq : 0, el = document.getElementById('pv-settle');
    if (!(aed > 0 && r > 0)) { el.innerHTML = '<span class="muted">Enter AED and the Dubai rate to preview</span>'; return; }
    const inr = R2(aed * r);
    const completes = b.status === 'converted_aed' && aed >= (b.aedAmount - (b.aedSettled || 0)) - 0.004;
    let extra = '';
    if (completes) {
      const y = R2((b.inrYield || 0) + inr), ds = b.dealIds.map(deal), pay = ds.reduce((s, d) => s + d.inrPayout, 0), fee = ds.reduce((s, d) => s + dealCalc(d).fee, 0);
      extra = `<dt>Batch INR total</dt><dd>${money(y, 'INR')}</dd><dt>Effective SAR → INR</dt><dd>${rate(y / b.sarTotal)}</dd><dt>Batch net profit</dt><dd class="${y - pay - fee >= 0 ? 'pos' : 'neg'}"><b>${money(y - pay - fee, 'INR')}</b></dd>`;
    }
    el.innerHTML = `<dl class="kv"><dt>INR for this part</dt><dd><b>${money(inr, 'INR')}</b></dd>${m > 0 ? `<dt>Dubai agent margin (this part)</dt><dd>${money(aed * (m - r), 'INR')}</dd>` : ''}${extra}</dl>${completes ? '<div class="small" style="margin-top:6px;color:var(--warn)">This part completes the batch and locks all its rates.</div>' : ''}`;
  },
  batch(f) {
    const ids = [...f.querySelectorAll('input[name=dealIds]:checked')].map(i => i.value);
    document.getElementById('pv-batch').innerHTML = `${ids.length} deals · <b>${money(ids.reduce((s, id) => s + deal(id).sarAmount, 0), 'SAR')}</b>`;
  },
};
