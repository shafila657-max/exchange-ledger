    </div></form>`, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="ratesForm">Save rates</button>`);
  },
  addSlab() { const sl = S.settings.slabs; sl.push({minInr: (Math.max(...sl.map(x => x.minInr)) || 0) + 500000, premium: 1}); save(); render(); },
  delSlab(el) { S.settings.slabs.splice(+el.dataset.i, 1); save(); render(); },
  capital(el) {
    const k = el.dataset.kind;
    const T = {add: 'Add capital', withdraw: 'Withdraw capital', transfer: 'Move operator funds'};
    const all = HOLDER_ORDER.flatMap(t => partiesOf(t)).map(p => ({id: p.id, name: p.name + ' · ' + PT1[p.type]}));
    const op = partiesOf('operator')[0]?.id;
    openModal(T[k], `<form data-form="capital" id="capForm"><input type="hidden" name="kind" value="${k}"><div class="fg">
      <label class="f">Amount<input name="amount" type="number" step="any" min="0" required></label>
      <label class="f">Currency<select name="currency"><option>INR</option><option>SAR</option><option>AED</option></select></label>
      <label class="f ${k === 'transfer' ? '' : 'full'}">${k === 'add' ? 'Held by' : 'From'}<select name="partyId">${opts(all, op)}</select></label>
      ${k === 'transfer' ? `<label class="f">To<select name="toPartyId">${opts(all.filter(p => p.id !== op), '', 'Choose party')}</select></label>` : ''}
      <label class="f">Date<input type="date" name="date" value="${todayStr()}"></label>
      <label class="f">Note<input name="note" placeholder="${k === 'transfer' ? 'e.g. float advance' : 'optional'}"></label>
      <div class="full small muted">${k === 'add' ? 'Your own money entering the business. Raises capital invested.' : k === 'withdraw' ? 'Money you take out of the business. Lowers capital invested.' : 'Moves your money to a party (e.g. an advance to a distributor). Capital is unchanged; it now shows as a debtor.'}</div>
    </div></form>`, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="capForm">Save</button>`);
  },
  clearAll() { ask('Clear all transactions', 'Set every deal, batch, payment and capital entry to zero? Parties, regions and rates stay. Refresh the page any time to get the sample data back.', {danger: true, ok: 'Clear to zero'}, () => {
    const keep = {regions: S.regions, parties: S.parties, settings: S.settings};
    S = {...emptyState(), ...keep}; save(); closeModal(); location.hash = '#/dashboard'; render(); toast('All transactions cleared'); }); },
  resetDemo() { ask('Reset sample data', 'Replace everything entered in this browser with the original sample data?', {danger: true, ok: 'Reset'}, () => { seed(); save(); closeModal(); location.hash = '#/dashboard'; render(); toast('Sample data restored'); }); },
  newDeal() { openModal('New deal', dealForm(), `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="dealForm">Save deal</button>`); },
  reverseDeal(el) {
    const d = deal(el.dataset.id);
    openModal('Reverse & re-enter ' + d.dealNo, dealForm({...d, replacesDealId: d.id}), `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="dealForm">Reverse &amp; save corrected deal</button>`);
  },
  cancelDeal(el) { ask('Cancel deal', 'The SAR is reversed out of the Saudi agent ledger. This cannot be undone.', {reason: true, danger: true, ok: 'Cancel deal'}, reason => run(() => A.cancelDeal(el.dataset.id, reason), 'Deal cancelled · reversal posted')); },
  assignDist(el) {
    const d = deal(el.dataset.id);
    const dl = partiesOf('distributor').sort((a, b) => (b.regionId === d.regionId) - (a.regionId === d.regionId));
    openModal('Assign ' + d.dealNo + ' to distributor', `<form data-form="assign" id="assignForm" data-id="${d.id}"><div class="fg">
      <label class="f full">Distributor <span class="muted">(${esc(rname(d.regionId))} first)</span><select name="distributorId">${dl.map(p => `<option value="${p.id}" ${p.id === (d.distributorId || dl[0]?.id) ? 'selected' : ''}>${esc(p.name)} · ${esc(rname(p.regionId))}</option>`).join('')}</select></label>
      <label class="f">Delivery fee (INR)<input name="fee" type="number" step="any" min="0" value="${d.status === 'assigned' ? d.distributorFeeInr : S.settings.defaultDistributorFeeInr}"></label>
      <div class="preview"><dl class="kv"><dt>Pay recipient</dt><dd><b>${money(d.inrPayout, 'INR')}</b></dd></dl><div class="small muted">${esc(d.recipientName)} · ${esc(d.recipientAddress)}</div></div></div></form>`,
      `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="assignForm">Assign</button>`);
  },
  advanceDeal(el) { run(() => A.advanceDeal(el.dataset.id), 'Status updated'); },
  newBatch() {
    const unb = S.deals.filter(d => !d.batchId && d.status !== 'cancelled');
    openModal('New transit batch', `<form data-form="batch" data-live="batch" id="batchForm"><div class="fg">
      <label class="f">Saudi collector<select name="saudiCollectorId">${opts(partiesOf('saudi_collector'), partiesOf('saudi_collector')[0]?.id)}</select></label>
      <label class="f">Batch date<input type="date" name="createdOn" value="${todayStr()}"></label>
      <div class="full"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="small muted"><b>Deals not yet batched</b></span><span class="small" id="pv-batch"></span></div>
      <div class="checklist">${unb.map(d => `<label><input type="checkbox" name="dealIds" value="${d.id}" checked><span style="flex:1">${d.dealNo} · ${esc(d.recipientName)}<div class="small muted">${esc(pname(d.saudiAgentId))} · ${fdate(d.dealDate)}</div></span><span class="num">${money(d.sarAmount, 'SAR')}</span></label>`).join('') || '<div class="empty">All deals are already batched</div>'}</div></div>
    </div></form>`, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="batchForm" ${unb.length ? '' : 'disabled'}>Create batch</button>`);
  },
  reverseBatch(el) { ask('Reverse batch', 'Its deals will be released so they can go into a new batch.', {reason: true, danger: true, ok: 'Reverse batch'}, reason => run(() => A.reverseBatch(el.dataset.id, reason), 'Batch reversed')); },
  addAlloc(el) {
    const b = batch(el.dataset.id);
    const left = R2(b.inrYield - S.allocations.filter(a => a.batchId === b.id).reduce((s, a) => s + a.inrAmount, 0));
    openModal('Dubai agent → distributor payment', `<form data-form="alloc" id="allocForm" data-id="${b.id}"><div class="fg">
      <label class="f">Distributor<select name="distributorId">${partiesOf('distributor').map(p => `<option value="${p.id}">${esc(p.name)} · ${esc(rname(p.regionId))}</option>`).join('')}</select></label>
      <label class="f">INR amount <span class="muted">(max ${money(left, 'INR')})</span><input name="inrAmount" type="number" step="any" min="0" max="${left}" required></label>
      <label class="f">Date<input type="date" name="date" value="${todayStr()}"></label>
      <label class="f">Note<input name="note" placeholder="optional"></label></div></form>`,
      `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="allocForm">Record payment</button>`);
  },
  editParty(el) {
    const p = el.dataset.id ? party(el.dataset.id) : {type: el.dataset.type, name: '', phone: '', notes: '', active: true};
    openModal((el.dataset.id ? 'Edit ' : 'Add ') + PT1[p.type], `<form data-form="party" id="partyForm"><input type="hidden" name="id" value="${p.id || ''}"><input type="hidden" name="type" value="${p.type}"><div class="fg">
      <label class="f">Name<input name="name" value="${esc(p.name)}" required></label>
      <label class="f">Phone<input name="phone" value="${esc(p.phone)}"></label>
      ${p.type === 'distributor' ? `<label class="f">Region<select name="regionId">${opts(S.regions, p.regionId, 'Choose region')}</select></label>` : ''}
      <label class="f full">Notes<textarea name="notes">${esc(p.notes || '')}</textarea></label>
      ${p.id ? `<label class="row small"><input type="checkbox" name="active" ${p.active ? 'checked' : ''} style="width:auto"> Active</label>` : ''}</div></form>`,
      `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" form="partyForm">Save</button>`);
  },
  partyTab(el, e) { e.preventDefault(); UI.partyTab = el.dataset.tab; if (location.hash !== '#/parties') location.hash = '#/parties'; else render(); },
  clearDealFilters() { UI.deals = {q: '', status: '', agent: '', region: '', dist: '', from: '', to: ''}; render(); },
  exportCsv() {
    const r = UI.report;
    const ds = S.deals.filter(d => (!r.from || d.dealDate >= r.from) && (!r.to || d.dealDate <= r.to));
    const head = ['Deal', 'Date', 'Saudi agent', 'Recipient', 'Region', 'SAR', 'Dubai quote (AED/₹1000)', 'Slab', 'Override', 'Premium', 'Customer rate (SAR/₹1000)', 'INR payout', 'Effective rate', 'INR Dubai yield', 'Fee', 'Net profit INR', 'Net profit SAR', 'Profit basis', 'Batch', 'Distributor', 'Status'];
    const rows = ds.map(d => { const c = dealCalc(d); return [d.dealNo, d.dealDate, pname(d.saudiAgentId), d.recipientName, rname(d.regionId), d.sarAmount, d.dubaiQuote, d.slab?.label || '', d.rateOverride ? 'yes' : '', d.premium, d.custRate, d.inrPayout, c.effRate, c.yieldInr, c.fee, d.status === 'cancelled' ? '' : c.net, d.status === 'cancelled' ? '' : profitSar(c), c.settled ? 'actual' : 'estimated', d.batchId ? batch(d.batchId).batchNo : '', d.distributorId ? pname(d.distributorId) : '', DS[d.status][0]]; });
    const csv = [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const filename = `deals_${r.from || 'all'}_${r.to || 'all'}.csv`;
    (async () => {
      // On claude.ai the viewer saves through the downloads capability; opened as a local file, fall back to a normal download.
      const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try { await dl.save({filename, data: csv}); toast('CSV saved'); }
        catch (e) { if (e?.code === 'rate_limited') toast('A save prompt is already open', true); else if (e?.code !== 'declined') toast('Downloads are not available in this view', true); }
        return;
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = filename; a.click();
    })();
  },
};
const FORMS = {
  deal(v) { run(() => { if (v.replacesDealId) { A.cancelDeal(v.replacesDealId, 'Reversed for correction'); } const d = A.addDeal(v); location.hash = '#/deal/' + d.id; }, v.replacesDealId ? 'Original reversed · corrected deal saved' : 'Deal saved'); },
  assign(v, f) { run(() => A.assignDistributor(f.dataset.id, v.distributorId, v.fee), 'Distributor assigned'); },
  batch(v, f) { run(() => { const b = A.createBatch({...v, dealIds: [...f.querySelectorAll('input[name=dealIds]:checked')].map(i => i.value)}); location.hash = '#/batch/' + b.id; }, 'Batch created'); },
  transit(v, f) { run(() => A.batchTransit(f.dataset.id, v.dubaiCollectorId), 'Marked in transit'); },
  convert(v, f) { run(() => A.batchConvert(f.dataset.id, v), 'Conversion part recorded'); },
  settle(v, f) {
    v = {...v, rate: num(v.quote) > 0 ? 1000 / num(v.quote) : 0, marketRate: num(v.marketQuote) > 0 ? 1000 / num(v.marketQuote) : undefined};
    const b = batch(f.dataset.id), completes = b.status === 'converted_aed' && num(v.aed) >= (b.aedAmount - (b.aedSettled || 0)) - 0.004;
    const go = () => run(() => A.batchSettle(f.dataset.id, v), completes ? 'Batch fully settled · rates locked' : 'Settlement part recorded');
    if (completes) ask('Complete & lock batch', 'This part completes the batch. All its rates and per-deal profit become permanent.', {ok: 'Settle & lock'}, go); else go();
  },
  alloc(v, f) { run(() => A.addAllocation({...v, batchId: f.dataset.id}), 'Payment recorded'); },
  party(v) { run(() => A.saveParty({...v, active: v.id ? v.active === 'on' : true}), 'Saved'); },
  settings(v) { run(() => A.saveSettings(v), 'Settings saved'); },
  rates(v) { run(() => A.setRates(v), "Today's rates updated"); },
  slabs(v, f) { run(() => A.saveSlabs([...f.querySelectorAll('[data-slab]')].map(r => ({minInr: num(r.querySelector('[name=minInr]').value), premium: num(r.querySelector('[name=premium]').value)}))), 'Rate slabs saved'); },
  capital(v) { run(() => A.capitalEntry(v), 'Capital entry saved'); },
  region(v) { run(() => A.addRegion(v.name || ''), 'Region added'); },
  ask(v) { const cb = ASK_CB; ASK_CB = null; if (cb) cb((v.reason || '').trim()); },
  globalSearch(v) { UI.deals = {q: (v.q || '').trim(), status: '', agent: '', region: '', dist: '', from: '', to: ''}; document.getElementById('gsearch').value = ''; if (location.hash !== '#/deals') location.hash = '#/deals'; else render(); },
};
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !modal.open) { e.preventDefault(); document.getElementById('gsearch').focus(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.dataset.act !== 'menu' && el.closest('.side')) document.body.classList.remove('menu-open');
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form]?.(Object.fromEntries(new FormData(f)), f);
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip'); if (!tip) return;
  const h = e.target.closest?.('[data-ci]');
  if (!h || !CHART) { tip.classList.remove('show'); return; }
  const i = +h.dataset.ci, box = document.getElementById('chart').getBoundingClientRect();
  tip.innerHTML = `<div class="tt">${fdate(CHART.labels[i])}</div><div class="tr"><i class="sw" style="background:var(--accent)"></i><span>${CHART.n1}</span><span>${money(CHART.s1[i], 'INR')}</span></div><div class="tr"><i class="sw" style="background:var(--accent-2)"></i><span>${CHART.n2}</span><span>${money(CHART.s2[i], 'INR')}</span></div>`;
  let x = e.clientX - box.left + 14; if (x + 190 > box.width) x = e.clientX - box.left - 200;
  tip.style.left = x + 'px'; tip.style.top = Math.max(0, e.clientY - box.top - 40) + 'px'; tip.classList.add('show');
});
document.addEventListener('input', e => { const f = e.target.closest('form[data-live]'); if (f) LIVE[f.dataset.live]?.(f, e.target); });
document.addEventListener('change', e => {
  const el = e.target.closest('[data-filter]'); if (!el) return;
  const [grp, k] = el.dataset.filter.split('.'); UI[grp][k] = el.value; render();
});
document.addEventListener('keyup', e => {
  if (e.target.id === 'f-q') { clearTimeout(ACT._qt); ACT._qt = setTimeout(() => { UI.deals.q = e.target.value; render(); }, 250); }
});

/* ============================ router ============================ */
function render() {
  const [page, id] = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/');
  const navKey = {deal: 'deals', batch: 'batches', party: 'parties'}[page] || page;
  const cnt = navCounts();
  document.getElementById('nav').innerHTML = NAV_SECTIONS.map(([sec, items]) => `<div class="navsec">${sec}</div>` + items.map(([k, l]) =>
    `<a href="#/${k}" class="${k === navKey ? 'on' : ''}">${icon(k)}<span>${l}</span>${cnt[k] ? `<span class="cnt" title="Needs action">${cnt[k]}</span>` : ''}</a>`).join('')).join('');
  document.getElementById('ptitle').textContent = TITLES[page] || '';
  document.getElementById('pactions').innerHTML = `<button class="btn" data-act="rates" title="Update today's rates"><span class="hide-m">Dubai</span> <b style="font-variant-numeric:tabular-nums">${rate(S.settings.dubaiQuote)}</b> <span class="muted small hide-m">${S.settings.rateLog.length ? fdt(S.settings.rateLog.at(-1).at) : ''}</span></button><button class="btn ico-m" data-act="newBatch" title="New batch">${icon('batches')}<span class="hide-m">New batch</span></button><button class="btn pri ico-m" data-act="newDeal" title="New deal">${icon('plus')}<span class="hide-m">New deal</span></button>`;
  const TB = [['dashboard', 'Home'], ['deals', 'Deals'], ['batches', 'Batches'], ['parties', 'Parties']];
  document.getElementById('tabbar').innerHTML = TB.map(([k, l]) => `<a href="#/${k}" class="${k === navKey ? 'on' : ''}">${icon(k)}<span>${l}</span>${cnt[k] ? `<span class="cnt">${cnt[k]}</span>` : ''}</a>`).join('') +
    `<button data-act="menu" class="${TB.some(([k]) => k === navKey) ? '' : 'on'}"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span></button>`;
  const P = {dashboard: pageDashboard, deals: pageDeals, deal: () => pageDeal(id), batches: pageBatches, batch: () => pageBatch(id),
    parties: pageParties, party: () => pageParty(id), capital: pageCapital, balances: pageBalances, reports: pageReports, settings: pageSettings}[page] || notFound;
  const ae = document.activeElement, focusId = ae?.id, sel = focusId && ae.selectionStart;
  document.getElementById('view').innerHTML = P();
  labelTables(document.getElementById('view'));
  if (focusId) { const n = document.getElementById(focusId); if (n) { n.focus(); try { n.setSelectionRange(sel, sel); } catch (e) {} } }
}
window.addEventListener('hashchange', () => { document.body.classList.remove('menu-open'); render(); window.scrollTo(0, 0); });
// give every table cell its column name so phones can show rows as labelled cards
function labelTables(root) {
  root.querySelectorAll('.tw table').forEach(t => {
    const heads = []; t.querySelectorAll('thead th').forEach(th => { for (let i = 0; i < (th.colSpan || 1); i++) heads.push(th.textContent.trim()); });
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => {
      let c = 0;
      [...tr.cells].forEach(td => { if (!td.hasAttribute('data-label')) td.dataset.label = heads[c] ?? ''; if (td.colSpan > 1) td.classList.add('span'); c += td.colSpan || 1; });
    });
  });
}
try { localStorage.removeItem(KEY); } catch (e) {}
seed(); // always start from sample data; refresh resets
S.capital ??= []; S.counters.capital ??= 0; S.settings = {...defaultSettings(), ...S.settings};
if (!S.parties.some(p => p.type === 'operator')) S.parties.push({id: uid(), type: 'operator', name: 'Operator – Own Cash', phone: '', active: true});
save();
render();
</script>
